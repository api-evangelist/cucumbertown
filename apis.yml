name: CucumberTown
description: >-
  Cucumbertown was a recipe network and food-blogging platform ("a Tumblr for
  recipes") founded around 2011-2012 in Palo Alto, California by Cherian Thomas,
  Chris Luscher, Arun Prabhakar and Dan Hauk, and backed by 500 Startups (now
  500 Global) among other angel investors. It let home cooks and food bloggers
  publish, structure, and share recipes on a hosted network. Cucumbertown was
  acquired by the Japanese recipe network Cookpad in June 2015 and was fully
  shut down by March 31, 2017 for lack of a sustainable business model. The
  company is defunct and operates no public API or developer program. The
  cucumbertown.com domain now 302-redirects to Samsung Food
  (app.samsungfood.com, formerly Whisk), an unrelated successor product; none of
  the artifacts served on that host belong to Cucumbertown.
